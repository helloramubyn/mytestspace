<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 340" role="img" aria-label="App CI/CD pipeline flow: a push or pull request triggers the Build and Test stage. If it is a direct push to main, the Build and Push Image stage runs and uploads a Docker image to ACR. Then the Deploy to AKS stage applies Kubernetes manifests, substituting in that exact image, producing a rolling update on the cluster.">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="340" fill="#ffffff"/>

  <!-- Trigger -->
  <rect x="20" y="120" width="150" height="70" rx="8" fill="#eef2ff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="95" y="150" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">Push or PR</text>
  <text x="95" y="167" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">to app-repo</text>

  <!-- Stage 1 -->
  <rect x="210" y="120" width="190" height="70" rx="8" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/>
  <text x="305" y="145" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">Stage 1: Build &amp; Test</text>
  <text x="305" y="162" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">mvn clean verify</text>
  <text x="305" y="177" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">runs on every push/PR</text>

  <!-- condition note -->
  <text x="475" y="105" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#b45309">only if: branch = main AND not a PR</text>

  <!-- Stage 2 -->
  <rect x="440" y="120" width="200" height="70" rx="8" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/>
  <text x="540" y="142" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">Stage 2: Build &amp; Push</text>
  <text x="540" y="159" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">docker build + push</text>
  <text x="540" y="175" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">image tagged with commit SHA</text>

  <!-- ACR -->
  <rect x="700" y="30" width="150" height="60" rx="8" fill="#dcfce7" stroke="#1e293b" stroke-width="1.5"/>
  <text x="775" y="55" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">ACR</text>
  <text x="775" y="72" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">image stored here</text>

  <!-- Stage 3 -->
  <rect x="700" y="120" width="200" height="70" rx="8" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/>
  <text x="800" y="142" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">Stage 3: Deploy to AKS</text>
  <text x="800" y="159" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">KubernetesManifest task</text>
  <text x="800" y="175" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">substitutes real image name</text>

  <!-- AKS -->
  <rect x="970" y="120" width="180" height="80" rx="8" fill="#bbf7d0" stroke="#1e293b" stroke-width="2"/>
  <text x="1060" y="148" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1e293b">AKS Cluster</text>
  <text x="1060" y="165" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">rolling update:</text>
  <text x="1060" y="180" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#475569">old pods swapped for new</text>

  <!-- arrows -->
  <line x1="170" y1="155" x2="208" y2="155" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="400" y1="155" x2="438" y2="155" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="640" y1="155" x2="775" y2="92" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="650" y="120" font-size="11" font-family="sans-serif" fill="#1e293b">docker push</text>
  <line x1="640" y1="165" x2="698" y2="165" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="900" y1="155" x2="968" y2="155" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="905" y="145" font-size="11" font-family="sans-serif" fill="#1e293b">kubectl apply</text>

  <!-- environment gate note -->
  <rect x="700" y="250" width="200" height="55" rx="8" fill="#fef3c7" stroke="#1e293b" stroke-width="1.5"/>
  <text x="800" y="272" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#1e293b">"production" environment</text>
  <text x="800" y="288" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#1e293b">optional approval gate here</text>
  <line x1="800" y1="248" x2="800" y2="192" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
