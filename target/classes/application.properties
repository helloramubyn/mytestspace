# This file holds configuration settings that Spring Boot reads automatically
# on startup. Each line is a "key=value" setting.

# Which network port the embedded web server listens on inside the container.
# Our Dockerfile and Kubernetes Service both expect this to be 8080.
server.port=8080

# By default, Spring Boot Actuator hides most of its diagnostic endpoints for
# security. This line explicitly turns on the "health" endpoint (is the app
# alive?) and "info" endpoint (basic app metadata) so Kubernetes can call them.
management.endpoints.web.exposure.include=health,info

# Splits /actuator/health into two more specific checks: "liveness" (is the
# process still running / not stuck?) and "readiness" (is it ready to accept
# traffic yet?). Kubernetes uses these separately in deployment.yaml.
management.endpoint.health.probes.enabled=true
